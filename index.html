<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>答题</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="wrap">
  <header>
    <h1>📚 本地答题</h1>
    <div class="stats" id="stats"></div>
  </header>

  <div class="toolbar">
    <button data-mode="all">顺序练习</button>
    <button data-mode="random">随机练习</button>
    <button data-mode="wrong">错题重练 (<span id="wrongCount">0</span>)</button>
    <button id="btnExam" class="primary">模拟考试</button>
    <button id="btnBank">题库管理</button>
  </div>

  <main id="card"></main>
</div>

<!-- 题库管理弹窗 -->
<div class="modal" id="modal">
  <div class="modal-box">
    <h2>题库管理</h2>
    <p>粘贴 JSON 数组，或选择 .json / .txt 文件导入。修改后点「保存题库」生效。</p>
    <input type="file" id="fileInput" accept=".json,.txt">
    <textarea id="bankText" spellcheck="false"></textarea>
    <div class="modal-actions">
      <button class="primary" id="btnSaveBank">保存题库</button>
      <button id="btnExport">导出题库</button>
      <button id="btnResetBank">恢复示例题库</button>
      <button id="btnClearWrong">清空错题本</button>
      <button id="btnCloseModal">关闭</button>
    </div>
    <div id="bankMsg"></div>
  </div>
</div>

<!-- 考试设置弹窗 -->
<div class="modal" id="examSetupModal">
  <div class="modal-box">
    <h2>模拟考试</h2>
    <p>设置参数后开始。交卷后自动显示成绩，错题会记入错题本。</p>
    <div class="form-row">
      <label>题目数量</label>
      <select id="examCount">
        <option value="10">10 题</option>
        <option value="20" selected>20 题</option>
        <option value="50">50 题</option>
        <option value="100">100 题</option>
        <option value="all">全部题目</option>
      </select>
    </div>
    <div class="form-row">
      <label>时间限制</label>
      <select id="examTime">
        <option value="15">15 分钟</option>
        <option value="30" selected>30 分钟</option>
        <option value="60">60 分钟</option>
        <option value="90">90 分钟</option>
        <option value="0">不限时</option>
      </select>
    </div>
    <div class="modal-actions">
      <button class="primary" id="btnStartExam">开始考试</button>
      <button id="btnCloseExamSetup">取消</button>
    </div>
  </div>
</div>

<!-- 考试成绩弹窗 -->
<div class="modal" id="examResultModal">
  <div class="modal-box">
    <h2>考试成绩</h2>
    <div id="examResultBody"></div>
    <div class="modal-actions">
      <button class="primary" id="btnExamRetry">再考一次</button>
      <button id="btnExamClose">关闭</button>
    </div>
  </div>
</div>

<script src="app.js"></script>
<script src="exam.js"></script>
</body>
</html>
